<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT Conditioning Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #7dd3fc;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-math: #34d399;
            --accent-eng: #f43f5e;
            --border: #334155;
            --correct: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        header {
            width: 100%;
            max-width: 650px;
            text-align: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Top Bar Layout */
        .progress-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            background: var(--card-bg);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            width: 100%;
        }

        .bar-left { text-align: left; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        .bar-right { text-align: right; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

        /* The Hardcoded 2-Minute Pacing Clock Widget */
        .timer-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.12);
            padding: 0.4rem 0.85rem;
            border-radius: 8px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .timer-badge.critical {
            color: var(--accent-eng);
            background: rgba(244, 63, 94, 0.15);
            border-color: rgba(244, 63, 94, 0.4);
        }

        /* Fluid Box Container - No Fixed Heights */
        .flashcard-wrapper {
            width: 100%;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 20px;
            border: 2px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s ease;
        }

        .flashcard.viewing-strategy {
            border-color: var(--primary);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
        }
        .tag.math { color: var(--accent-math); background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.2); }
        .tag.english { color: var(--accent-eng); background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); }

        .hint-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .card-content {
            font-size: 1.1rem;
            line-height: 1.55;
            font-weight: 500;
            color: #f1f5f9;
            text-align: left;
            word-break: break-word;
        }

        /* Option Selections Matrix */
        .options-matrix {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            width: 100%;
        }

        .option-row {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.15s ease;
            width: 100%;
        }

        .option-row:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--text-muted);
        }

        .option-row.selected {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.08);
        }

        .option-badge {
            background: var(--border);
            color: var(--text-muted);
            width: 26px;
            height: 26px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .option-row.selected .option-badge {
            background: var(--primary);
            color: #000;
        }

        .card-footer-note {
            font-size: 0.75rem; 
            color: var(--text-muted); 
            font-weight: 500;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 0.75rem;
        }

        .nav-layout {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
        }

        button.nav-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.85rem 0.5rem;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.nav-btn:hover:not(:disabled) {
            background-color: var(--border);
            border-color: var(--text-muted);
        }

        button:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        button.action-btn {
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 14px;
            padding: 0.85rem 0.5rem;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button.action-btn:hover {
            background-color: var(--primary-hover);
        }

        .status-msg {
            text-align: center;
            padding: 3rem 1.5rem;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header>
        <h1 id="app-title">Conditioning Routine</h1>
        <div class="subtitle" id="app-subtitle">Syncing engine cache...</div>
    </header>

    <div class="container">
        <div class="progress-bar">
            <div class="bar-left" id="card-index-label">Card 0 of 0</div>
            <div class="timer-badge" id="clock-widget">
                <span>⏱️</span>
                <span id="clock-label">02:00</span>
            </div>
            <div class="bar-right" id="countdown-label">-- out</div>
        </div>

        <div id="deck-viewport">
            <div class="status-msg">
                <p>Connecting to Google Sheets data engine...</p>
            </div>
        </div>

        <div class="nav-layout">
            <button id="prev-btn" class="nav-btn" disabled>&larr; Prev</button>
            <button id="flip-btn" class="action-btn">Reveal Strategy</button>
            <button id="next-btn" class="nav-btn" disabled>Next &rarr;</button>
        </div>
    </div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1ILguhfA-x21gVWL_CrGRfebCEDfWJmZicYVVZ4bMkw8IuSz5kWJqNaIE5iuhmpU4JM0HAS3c2Ob-/pub?output=csv';
        const EXAM_DATE = new Date('2026-06-06T00:00:00');
        const FIXED_DURATION = 120; // Hardcoded 2 Minutes Countdown per card

        let masterDeck = [];
        let currentCardIndex = 0;
        let activeCycleDay = 1;
        let countdownEngine = null;
        let timeRemainingSeconds = FIXED_DURATION;
        let showingStrategy = false;

        function calculateTargetCycleDay() {
            const now = new Date();
            const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const anchorDate = new Date('2026-05-24T00:00:00'); 
            const diffTime = todayMidnight - anchorDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays >= 0 ? diffDays + 1 : 1;
        }

        function updateGlobalMetadata() {
            const now = new Date();
            const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const daysRemaining = Math.floor((EXAM_DATE - todayMidnight) / (1000 * 60 * 60 * 24));
            document.getElementById('countdown-label').innerText = daysRemaining > 0 ? `${daysRemaining}d out` : 'Exam';
        }

        // Dedicated clock lifecycle wrapper
        function restartClockSystem() {
            clearInterval(countdownEngine);
            timeRemainingSeconds = FIXED_DURATION;
            
            const label = document.getElementById('clock-label');
            const widget = document.getElementById('clock-widget');
            
            widget.classList.remove('critical');
            label.innerText = "02:00";

            countdownEngine = setInterval(() => {
                timeRemainingSeconds--;
                
                let m = Math.floor(timeRemainingSeconds / 60).toString().padStart(2, '0');
                let s = (timeRemainingSeconds % 60).toString().padStart(2, '0');
                label.innerText = `${m}:${s}`;

                if (timeRemainingSeconds <= 15) widget.classList.add('critical');
                if (timeRemainingSeconds <= 0) clearInterval(countdownEngine);
            }, 1000);
        }

        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i], next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) { row.push(''); }
                else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row); row = [''];
                } else { row[row.length - 1] += c; }
            }
            if (row.length > 1 || row[0] !== '') lines.push(row);
            return lines;
        }

        async function fetchAndBuildDeck() {
            updateGlobalMetadata();
            activeCycleDay = calculateTargetCycleDay();
            
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error("Spreadsheet engine rejected sync request.");
                const rawText = await response.text();
                const cleanRows = parseCSV(rawText);
                
                const headers = cleanRows[0].map(h => h.trim().toLowerCase());
                const dayIdx = headers.indexOf('day'), domainIdx = headers.indexOf('domain');
                const frontIdx = headers.indexOf('front'), backIdx = headers.indexOf('back');

                if (dayIdx === -1 || domainIdx === -1 || frontIdx === -1 || backIdx === -1) {
                    throw new Error("Column header mapping names mismatch.");
                }

                const parsedCards = [];
                for (let i = 1; i < cleanRows.length; i++) {
                    const r = cleanRows[i];
                    if (r.length < 4 || !r[dayIdx]) continue;
                    parsedCards.push({
                        day: parseInt(r[dayIdx].trim(), 10),
                        domain: r[domainIdx].trim(),
                        front: r[frontIdx].trim(),
                        back: r[backIdx].trim()
                    });
                }

                masterDeck = parsedCards.filter(c => c.day === activeCycleDay);
                if (masterDeck.length === 0 && parsedCards.length > 0) {
                    const maxDay = Math.max(...parsedCards.map(c => c.day));
                    masterDeck = parsedCards.filter(c => c.day === (((activeCycleDay - 1) % maxDay) + 1));
                }

                document.getElementById('app-title').innerText = `Conditioning Routine`;
                document.getElementById('app-subtitle').innerText = `Sequence Strategy Matrix: Day ${activeCycleDay}`;
                
                currentCardIndex = 0;
                renderAppWorkspace();

            } catch (err) {
                document.getElementById('deck-viewport').innerHTML = `<div class="status-msg"><h3 style="color:var(--accent-eng)">Handshake Denied</h3><p>${err.message}</p></div>`;
            }
        }

        function renderAppWorkspace() {
            const viewport = document.getElementById('deck-viewport');
            const card = masterDeck[currentCardIndex];
            
            const isMath = card.domain.toLowerCase().includes('math');
            const typeClass = isMath ? 'math' : 'english';
            const domainLabel = isMath ? 'Quant: Calibration' : 'EBRW: Information & Ideas';

            showingStrategy = false;
            document.getElementById('flip-btn').innerText = "Reveal Strategy";

            viewport.innerHTML = `
                <div class="flashcard-wrapper" id="card-clickable-zone">
                    <div class="flashcard" id="main-flashcard-box">
                        <div class="card-meta">
                            <span class="tag ${typeClass}" id="card-tag-field">${domainLabel}</span>
                            <span class="hint-text" id="card-hint-field">Isolate Traps</span>
                        </div>
                        
                        <div class="card-content" id="card-main-string">${card.front}</div>
                        
                        <div class="options-matrix" id="interactive-matrix">
                            <div class="option-row" onclick="handleChoiceSelect(this)"><div class="option-badge">A</div>Option Choice A</div>
                            <div class="option-row" onclick="handleChoiceSelect(this)"><div class="option-badge">B</div>Option Choice B</div>
                            <div class="option-row" onclick="handleChoiceSelect(this)"><div class="option-badge">C</div>Option Choice C</div>
                            <div class="option-row" onclick="handleChoiceSelect(this)"><div class="option-badge">D</div>Option Choice D</div>
                        </div>

                        <div class="card-footer-note" id="card-footer-text">Objective: Scan pattern context & flag variance mechanics.</div>
                    </div>
                </div>
            `;

            document.getElementById('card-index-label').innerText = `Card ${currentCardIndex + 1} of ${masterDeck.length}`;
            document.getElementById('prev-btn').disabled = currentCardIndex === 0;
            document.getElementById('next-btn').disabled = currentCardIndex === masterDeck.length - 1;
            
            restartClockSystem();
        }

        function handleChoiceSelect(element) {
            if (showingStrategy) return; // Freeze selections during strategic evaluation review
            const siblings = element.parentElement.querySelectorAll('.option-row');
            siblings.forEach(s => s.classList.remove('selected'));
            element.classList.add('selected');
        }

        function toggleSystemFlip() {
            const card = masterDeck[currentCardIndex];
            const mainBox = document.getElementById('main-flashcard-box');
            const stringField = document.getElementById('card-main-string');
            const matrixZone = document.getElementById('interactive-matrix');
            const tagField = document.getElementById('card-tag-field');
            const hintField = document.getElementById('card-hint-field');
            const footerField = document.getElementById('card-footer-text');
            const flipBtn = document.getElementById('flip-btn');

            if (!showingStrategy) {
                // Flip to Strategic Assessment Mode
                showingStrategy = true;
                clearInterval(countdownEngine);
                mainBox.classList.add('viewing-strategy');
                stringField.innerHTML = card.back;
                matrixZone.style.display = 'none'; // Clear options layout
                hintField.innerText = "Strategy Core";
                tagField.innerText = card.domain;
                footerField.innerText = "Execution Verified. Press button to return to metrics.";
                flipBtn.innerText = "Show Metric Question";
            } else {
                // Return to active testing metric mode
                showingStrategy = false;
                mainBox.classList.remove('viewing-strategy');
                stringField.innerHTML = card.front;
                matrixZone.style.display = 'flex'; // Remount options layout
                hintField.innerText = "Isolate Traps";
                const isMath = card.domain.toLowerCase().includes('math');
                tagField.innerText = isMath ? 'Quant: Calibration' : 'EBRW: Information & Ideas';
                footerField.innerText = "Objective: Scan pattern context & flag variance mechanics.";
                flipBtn.innerText = "Reveal Strategy";
                restartClockSystem();
            }
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentCardIndex > 0) { currentCardIndex--; renderAppWorkspace(); }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentCardIndex < masterDeck.length - 1) { currentCardIndex++; renderAppWorkspace(); }
        });

        document.getElementById('flip-btn').addEventListener('click', toggleSystemFlip);
        window.addEventListener('DOMContentLoaded', fetchAndBuildDeck);
    </script>
</body>
</html>
