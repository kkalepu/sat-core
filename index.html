<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT Conditioning Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #7dd3fc;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-math: #34d399;
            --accent-eng: #f43f5e;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        header {
            width: 100%;
            max-width: 650px;
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--card-bg);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            min-height: 420px;
            cursor: pointer;
            display: grid;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
            display: grid;
        }

        .flashcard-wrapper.flipped .flashcard {
            transform: rotateY(180deg);
        }

        .card-face {
            position: relative;
            grid-area: 1 / 1 / 2 / 2;
            width: 100%;
            min-height: 420px;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-front {
            background-color: var(--card-bg);
        }

        .card-back {
            background-color: #1e293b;
            transform: rotateY(180deg);
            border-color: var(--primary);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 1rem;
        }

        .tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }

        .tag.math { color: var(--accent-math); border: 1px solid rgba(52, 211, 153, 0.2); }
        .tag.english { color: var(--accent-eng); border: 1px solid rgba(244, 63, 94, 0.2); }

        .hint-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-content {
            font-size: 1.15rem;
            line-height: 1.55;
            font-weight: 500;
            text-align: left;
            margin-bottom: 1.5rem;
            color: #f1f5f9;
        }

        .card-back .card-content {
            font-size: 1.05rem;
        }

        .card-footer-note {
            font-size: 0.75rem; 
            color: var(--text-muted); 
            font-weight: 500;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 0.75rem;
            margin-top: auto;
        }

        .nav-layout {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            margin-top: 0.5rem;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.85rem 0.5rem;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover:not(:disabled) {
            background-color: var(--border);
            border-color: var(--text-muted);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        button.action-btn {
            background-color: var(--primary);
            color: #000;
            border: none;
        }

        button.action-btn:hover {
            background-color: var(--primary-hover);
        }

        .status-msg {
            text-align: center;
            padding: 3rem 1.5rem;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header>
        <h1 id="app-title">Conditioning Routine</h1>
        <div class="subtitle" id="app-subtitle">Syncing with database...</div>
    </header>

    <div class="container">
        <div class="progress-bar">
            <span id="card-index-label">Card 0 of 0</span>
            <span id="countdown-label">-- days to exam</span>
        </div>

        <div id="deck-viewport">
            <div class="status-msg">
                <p>Establishing secure handshake with storage layer...</p>
            </div>
        </div>

        <div class="nav-layout">
            <button id="prev-btn" disabled>&larr; Prev</button>
            <button id="flip-btn" class="action-btn">Reveal Strategy</button>
            <button id="next-btn" disabled>Next &rarr;</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1ILguhfA-x21gVWL_CrGRfebCEDfWJmZicYVVZ4bMkw8IuSz5kWJqNaIE5iuhmpU4JM0HAS3c2Ob-/pub?output=csv';
        const EXAM_DATE = new Date('2026-06-06T00:00:00');

        let masterDeck = [];
        let currentCardIndex = 0;
        let activeCycleDay = 1;

        // FIXED: Pure calendar day math calculation
        function calculateTargetCycleDay() {
            const now = new Date();
            const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const anchorDate = new Date('2026-05-24T00:00:00'); 
            
            const diffTime = todayMidnight - anchorDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays >= 0 ? diffDays + 1 : 1;
        }

        // FIXED: Stabilized countdown rounding architecture
        function updateGlobalMetadata() {
            const now = new Date();
            const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            const timeRemaining = EXAM_DATE - todayMidnight;
            const daysRemaining = Math.floor(timeRemaining / (1000 * 60 * 60 * 24));
            
            const countdownEl = document.getElementById('countdown-label');
            if (daysRemaining > 0) {
                countdownEl.innerText = `${daysRemaining} days to exam`;
            } else if (daysRemaining === 0) {
                countdownEl.innerText = `Exam Day`;
            } else {
                countdownEl.innerText = `Cycle Concluded`;
            }
        }

        function parseCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i+1];

                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') lines.push(row);
            return lines;
        }

        async function fetchAndBuildDeck() {
            updateGlobalMetadata();
            activeCycleDay = calculateTargetCycleDay();
            
            try {
                if (SHEET_CSV_URL.includes('PASTE_YOUR_PUBLISHED_CSV_URL_HERE')) {
                    throw new Error("Configuration required: URL placeholder detected.");
                }

                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error("Network layer denied storage access.");
                
                const rawText = await response.text();
                const cleanRows = parseCSV(rawText);
                
                if (cleanRows.length <= 1) throw new Error("Database returned an empty dataset.");

                const headers = cleanRows[0].map(h => h.trim().toLowerCase());
                const dayIdx = headers.indexOf('day');
                const domainIdx = headers.indexOf('domain');
                const frontIdx = headers.indexOf('front');
                const backIdx = headers.indexOf('back');

                if (dayIdx === -1 || domainIdx === -1 || frontIdx === -1 || backIdx === -1) {
                    throw new Error("Header validation failed. Check column layout labels.");
                }

                const parsedCards = [];
                for (let i = 1; i < cleanRows.length; i++) {
                    const r = cleanRows[i];
                    if (r.length < 4 || !r[dayIdx]) continue;
                    
                    parsedCards.push({
                        day: parseInt(r[dayIdx].trim(), 10),
                        domain: r[domainIdx].trim(),
                        front: r[frontIdx].trim(),
                        back: r[backIdx].trim()
                    });
                }

                masterDeck = parsedCards.filter(c => c.day === activeCycleDay);

                if (masterDeck.length === 0 && parsedCards.length > 0) {
                    const maxAvailableDay = Math.max(...parsedCards.map(c => c.day));
                    const loopedDay = ((activeCycleDay - 1) % maxAvailableDay) + 1;
                    masterDeck = parsedCards.filter(c => c.day === loopedDay);
                }

                if (masterDeck.length === 0) throw new Error("No card components extracted.");

                document.getElementById('app-title').innerText = `Conditioning Routine`;
                document.getElementById('app-subtitle').innerText = `Target Execution Sequence: Day ${activeCycleDay}`;
                
                currentCardIndex = 0;
                renderCard();

            } catch (err) {
                console.error(err);
                document.getElementById('app-title').innerText = "System Standby";
                document.getElementById('app-subtitle').innerText = "Data synchronization pending";
                document.getElementById('deck-viewport').innerHTML = `
                    <div class="status-msg">
                        <h3 style="margin-bottom:0.5rem; color:var(--accent-eng)">Handshake Delayed</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        }

        function renderCard() {
            const viewport = document.getElementById('deck-viewport');
            const card = masterDeck[currentCardIndex];
            
            const isMath = card.domain.toLowerCase().includes('math');
            const typeClass = isMath ? 'math' : 'english';
            const domainLabel = isMath ? 'Quant: Calibration' : 'EBRW: Information & Ideas';

            viewport.innerHTML = `
                <div class="flashcard-wrapper" id="card-wrapper" onclick="toggleCardFlip()">
                    <div class="flashcard">
                        <div class="card-face card-front">
                            <div class="card-meta">
                                <span class="tag ${typeClass}">${domainLabel}</span>
                                <span class="hint-text">Tap to evaluate</span>
                            </div>
                            <div class="card-content">${card.front}</div>
                            <div class="card-footer-note">Objective: Build conceptual processing speed & isolate traps.</div>
                        </div>
                        <div class="card-face card-back">
                            <div class="card-meta">
                                <span class="tag ${typeClass}">${card.domain}</span>
                                <span class="hint-text">Strategy Engine</span>
                            </div>
                            <div class="card-content">${card.back}</div>
                            <div class="card-footer-note" style="color: var(--primary);">Execution Verified &bull; Tap to flip back</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('card-index-label').innerText = `Card ${currentCardIndex + 1} of ${masterDeck.length}`;
            document.getElementById('prev-btn').disabled = currentCardIndex === 0;
            document.getElementById('next-btn').disabled = currentCardIndex === masterDeck.length - 1;
            
            resetFlipState();
        }

        function toggleCardFlip() {
            const wrapper = document.getElementById('card-wrapper');
            if (!wrapper) return;
            
            wrapper.classList.toggle('flipped');
            
            const flipBtn = document.getElementById('flip-btn');
            if (wrapper.classList.contains('flipped')) {
                flipBtn.innerText = "Show Metric Question";
            } else {
                flipBtn.innerText = "Reveal Strategy";
            }
        }

        function resetFlipState() {
            document.getElementById('flip-btn').innerText = "Reveal Strategy";
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                renderCard();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentCardIndex < masterDeck.length - 1) {
                currentCardIndex++;
                renderCard();
            }
        });

        document.getElementById('flip-btn').addEventListener('click', toggleCardFlip);
        window.addEventListener('DOMContentLoaded', fetchAndBuildDeck);
    </script>
</body>
</html>
