<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT Conditioning App - Phase 1</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --error: #dc2626;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .metadata {
            font-weight: 600;
            color: #64748b;
        }

        .timer-box {
            background: #fee2e2;
            color: var(--error);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .timer-urgent {
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .passage {
            background: #f1f5f9;
            padding: 15px;
            border-left: 4px solid #94a3b8;
            border-radius: 4px;
            margin-bottom: 15px;
            font-style: italic;
            white-space: pre-line;
        }

        .question {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .option-label:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }

        .option-label input {
            margin-right: 12px;
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }

        /* State Classes managed by JS */
        .option-label.selected {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .option-label.correct {
            border-color: var(--success);
            background-color: #f0fdf4;
            color: var(--success);
        }

        .option-label.incorrect {
            border-color: var(--error);
            background-color: #fef2f2;
            color: var(--error);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-weight: 500;
            display: none;
            line-height: 1.4;
        }

        .feedback-correct {
            background-color: #f0fdf4;
            border: 1px solid var(--success);
            color: #15803d;
        }

        .feedback-incorrect {
            background-color: #fef2f2;
            border: 1px solid var(--error);
            color: #b91c1c;
        }

        #loading {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card" id="quiz-card" style="display: none;">
        <div class="header">
            <div class="metadata" id="question-meta">Question 1</div>
            <div class="timer-box" id="timer-display">⏱️ 02:00</div>
        </div>

        <div id="passage-container" class="passage" style="display: none;"></div>
        <div class="question" id="question-text">Loading question...</div>

        <div class="options-list" id="options-container">
            </div>

        <button id="action-btn" class="btn" disabled>Submit Answer</button>
        
        <div id="feedback" class="feedback-box"></div>
    </div>

    <div id="loading">Loading SAT Questions from Google Sheet...</div>

    <script>
        // Target CSV URL provided
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1ILguhfA-x21gVWL_CrGRfebCEDfWJmZicYVVZ4bMkw8IuSz5kWJqNaIE5iuhmpU4JM0HAS3c2Ob-/pub?output=';
        let questions = [];
        let currentIndex = 0;
        let timerInterval = null;
        let timeLeft = 120; // 2 minutes in seconds
        let appState = "answering"; // answering, submitted, timeout

        // --- CSV Parser Helper ---
        function parseCSV(text) {
            let lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') lines.push(row);
            
            // Map headers to arrays of objects
            const headers = lines[0].map(h => h.trim().toLowerCase());
            return lines.slice(1).map(line => {
                let obj = {};
                headers.forEach((header, index) => {
                    obj[header] = line[index] ? line[index].trim() : "";
                });
                return obj;
            });
        }

        // --- Fetch Data ---
        async function loadQuestions() {
            try {
                const response = await fetch(csvUrl);
                const csvText = await response.text();
                questions = parseCSV(csvText);
                
                // Filter out any blank rows
                questions = questions.filter(q => q.question || q.question_text);

                if(questions.length === 0) throw new Error("No valid questions found.");
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('quiz-card').style.display = 'block';
                renderQuestion();
            } catch (error) {
                document.getElementById('loading').innerText = "Error loading dataset. Please check your sheet permissions.";
                console.error(error);
            }
        }

        // --- Timer Controller ---
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 120; 
            updateTimerDisplay();
            
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.classList.remove('timer-urgent');
            timerDisplay.style.background = '#fee2e2';

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 15) {
                    timerDisplay.classList.add('timer-urgent');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const seconds = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `⏱️ ${minutes}:${seconds}`;
        }

        // --- Render UI ---
        function renderQuestion() {
            appState = "answering";
            const q = questions[currentIndex];
            
            document.getElementById('question-meta').innerText = `Question ${currentIndex + 1} of ${questions.length}`;
            
            // Handle optional passage column
            const passageBox = document.getElementById('passage-container');
            if (q.passage && q.passage.trim() !== "") {
                passageBox.innerText = q.passage;
                passageBox.style.display = "block";
            } else {
                passageBox.style.display = "none";
            }

            // Fallback for varied header naming conventions
            document.getElementById('question-text').innerText = q.question || q.question_text;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            // Render keys dynamically matching sheet names
            const optionsMap = { 'A': q.a, 'B': q.b, 'C': q.c, 'D': q.d };
            
            Object.keys(optionsMap).forEach(key => {
                const label = document.createElement('label');
                label.className = 'option-label';
                label.innerHTML = `
                    <input type="radio" name="sat-option" value="${key}">
                    <span><strong>${key}.</strong> ${optionsMap[key]}</span>
                `;
                
                label.querySelector('input').addEventListener('change', (e) => {
                    if (appState !== "answering") return;
                    document.querySelectorAll('.option-label').forEach(el => el.classList.remove('selected'));
                    label.classList.add('selected');
                    document.getElementById('action-btn').disabled = false;
                });

                container.appendChild(label);
            });

            document.getElementById('feedback').style.display = 'none';
            const actionBtn = document.getElementById('action-btn');
            actionBtn.innerText = "Submit Answer";
            actionBtn.disabled = true;

            startTimer();
        }

        // --- Action Logic ---
        function handleSubmission() {
            clearInterval(timerInterval);
            appState = "submitted";
            
            const selectedInput = document.querySelector('input[name="sat-option"]:checked');
            const userAnswer = selectedInput.value;
            const q = questions[currentIndex];
            const correctAnswer = (q.correct_answer || q.answer || "").trim().toUpperCase();

            evaluateResults(userAnswer, correctAnswer, q.explanation);
        }

        function handleTimeout() {
            appState = "timeout";
            // Disable all radio buttons
            document.querySelectorAll('input[name="sat-option"]').forEach(input => input.disabled = true);
            
            const q = questions[currentIndex];
            const correctAnswer = (q.correct_answer || q.answer || "").trim().toUpperCase();

            evaluateResults(null, correctAnswer, q.explanation);
        }

        function evaluateResults(userAnswer, correctAnswer, explanationText) {
            const labels = document.querySelectorAll('.option-label');
            
            labels.forEach(label => {
                const val = label.querySelector('input').value;
                if (val === correctAnswer) {
                    label.classList.add('correct');
                } else if (val === userAnswer && userAnswer !== correctAnswer) {
                    label.classList.add('incorrect');
                }
            });

            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';

            if (userAnswer === null) {
                feedback.className = "feedback-box feedback-incorrect";
                feedback.innerHTML = `<strong>Time's Up!</strong> The correct answer was ${correctAnswer}.`;
            } else if (userAnswer === correctAnswer) {
                feedback.className = "feedback-box feedback-correct";
                feedback.innerHTML = `<strong>Correct!</strong> Excellent pace.`;
            } else {
                feedback.className = "feedback-box feedback-incorrect";
                feedback.innerHTML = `<strong>Incorrect.</strong> You chose ${userAnswer}. The correct answer was ${correctAnswer}.`;
            }

            if(explanationText) {
                feedback.innerHTML += `<br><br><small style="display:block; margin-top:5px; color:#475569;"><strong>Explanation:</strong> ${explanationText}</small>`;
            }

            const actionBtn = document.getElementById('action-btn');
            if (currentIndex < questions.length - 1) {
                actionBtn.innerText = "Next Question";
                actionBtn.disabled = false;
            } else {
                actionBtn.innerText = "Practice Complete";
                actionBtn.disabled = true;
            }
        }

        // Global Action Button routing
        document.getElementById('action-btn').addEventListener('click', () => {
            if (appState === "answering") {
                handleSubmission();
            } else if (appState === "submitted" || appState === "timeout") {
                currentIndex++;
                renderQuestion();
            }
        });

        // Initialize App
        loadQuestions();
    </script>
</body>
</html>
